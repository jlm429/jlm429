<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2" viewBox="0 0 1200 2" role="img" aria-labelledby="title desc" preserveAspectRatio="none" pointer-events="none">
  <title id="title">Moving color signal</title>
  <desc id="desc">A thin gradient bar with color moving from left to right.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.25" stop-color="#39d0d8"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="0.75" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <style>
      .motion { animation: travel 5s linear infinite; }
      @keyframes travel { to { transform: translateX(600px); } }
      @media (prefers-reduced-motion: reduce) { .motion { animation: none; } }
    </style>
  </defs>
  <rect class="motion" x="-600" width="1800" height="2" fill="url(#signal)"/>
</svg>
